[project]
name = "kg-quality-eval"
version = "0.1.0"
description = "Quality Evaluation of Data Integration Benchmark Datasets for Knowledge Graphs"
authors = [
    { name = "Aische Vera Spieker" },
    { name = "Berkay Ethem Özcekic" },
]
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
