# Non-Match-Varianten der sechs Kern-Datensaetze.
#
# match_ratio: 0.5 haelt die Haelfte der Gold-Paare intakt; aus der anderen
# Haelfte wird je zur Haelfte die KG1- bzw. KG2-Seite entfernt. Dadurch
# entstehen Entitaeten ohne Gegenstueck und die strikte Bijektivitaet der
# OpenEA-Benchmarks ist aufgebrochen. Siehe preprocessing/nonmatch.py.
backend:
  mode: pandas
  spark_master: local[*]
  spark_memory: 4g
  spark_metrics:
  - basic_stats
  - degree_distribution
  - property_distribution
datasets:
- fold: 1
  loader: openea
  name: EN_FR_15K_V1_NM
  path: data/raw/openea/EN_FR_15K_V1
  match_ratio: 0.5
- fold: 1
  loader: openea
  name: EN_FR_15K_V2_NM
  path: data/raw/openea/EN_FR_15K_V2
  match_ratio: 0.5
- fold: 1
  loader: openea
  name: EN_DE_15K_V1_NM
  path: data/raw/openea/EN_DE_15K_V1
  match_ratio: 0.5
- fold: 1
  loader: openea
  name: D_W_15K_V1_NM
  path: data/raw/openea/D_W_15K_V1
  match_ratio: 0.5
- fold: 1
  loader: openea
  name: D_Y_15K_V1_NM
  path: data/raw/openea/D_Y_15K_V1
  match_ratio: 0.5
- fold: 1
  loader: openea
  name: EN_FR_100K_V1_NM
  path: data/raw/openea/EN_FR_100K_V1
  skip_matchers:
  - pyjedai_ngram
  match_ratio: 0.5
eval_split: test
figures_dir: results/figures_nonmatch
matchers:
- name: value_overlap
- name: pyjedai_ngram
- name: structural_propagation
- name: paris
  params:
    heap: 4g
    jar_path: tools/paris_0_3.jar
    timeout_s: 7200
metrics:
- basic_stats
- degree_distribution
- property_distribution
- connectivity
- long_tail
- attribute_completeness
- type_distribution
- schema_heterogeneity
- aligned_consistency
- alignment_metrics
- alignment_reachability
output_dir: results/reports_nonmatch
project: kg-quality-eval
seed_split: train
