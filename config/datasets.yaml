project: kg-quality-eval
output_dir: results/reports
figures_dir: results/figures
eval_split: test
seed_split: train
datasets:
- name: EN_FR_15K_V1
  loader: openea
  path: data/raw/openea/EN_FR_15K_V1
  fold: 1
- name: EN_FR_15K_V2
  loader: openea
  path: data/raw/openea/EN_FR_15K_V2
  fold: 1
- name: EN_DE_15K_V1
  loader: openea
  path: data/raw/openea/EN_DE_15K_V1
  fold: 1
- name: D_W_15K_V1
  loader: openea
  path: data/raw/openea/D_W_15K_V1
  fold: 1
- name: D_Y_15K_V1
  loader: openea
  path: data/raw/openea/D_Y_15K_V1
  fold: 1
- name: EN_FR_100K_V1
  loader: openea
  path: data/raw/openea/EN_FR_100K_V1
  fold: 1
  skip_matchers:
  - pyjedai_ngram
metrics:
- basic_stats
- degree_distribution
- property_distribution
- connectivity
- long_tail
- attribute_completeness
- type_distribution
- schema_heterogeneity
- aligned_consistency
- alignment_metrics
- alignment_reachability
matchers:
- name: value_overlap
- name: pyjedai_ngram
- name: structural_propagation
- name: paris
  params:
    jar_path: tools/paris_0_3.jar
    heap: 4g
    timeout_s: 7200
backend:
  mode: pandas
  spark_master: local[*]
  spark_memory: 4g
  spark_metrics:
  - basic_stats
  - degree_distribution
  - property_distribution
