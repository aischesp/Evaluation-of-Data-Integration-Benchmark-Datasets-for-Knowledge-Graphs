# Pipeline configuration. Paths point to datasets under data/raw/ (not versioned).

project: kg-quality-eval
output_dir: results/reports

datasets:
  # OpenEA family
  - name: openea_en_fr_15k_v1
    loader: openea
    path: data/raw/openea/EN_FR_15K_V1

  - name: openea_en_fr_15k_v2
    loader: openea
    path: data/raw/openea/EN_FR_15K_V2

  - name: openea_en_de_15k_v1
    loader: openea
    path: data/raw/openea/EN_DE_15K_V1

  - name: openea_d_w_15k_v1
    loader: openea
    path: data/raw/openea/D_W_15K_V1

  - name: openea_d_y_15k_v1
    loader: openea
    path: data/raw/openea/D_Y_15K_V1

  - name: openea_en_fr_100k_v1
    loader: openea
    path: data/raw/openea/EN_FR_100K_V1

  # OAEI conference track (loader TBD)
  # - name: oaei_conference
  #   loader: rdf
  #   path: data/raw/oaei/conference

  # Custom DBpedia <-> Wikidata subset (loader TBD)
  # - name: custom_dbp_wiki
  #   loader: custom
  #   path: data/processed/custom_dbp_wiki

metrics:
  - basic_stats
  # - degree_distribution
  # - property_distribution
  # - connectivity
  # - attribute_completeness
  # - type_distribution
  # - alignment_metrics

backend:
  mode: auto         # auto | pandas | spark
  spark_master: local[*]
  spark_memory: 4g
