# Erweiterte Konfiguration: alle OpenEA-v2.0-Varianten unter data/raw/openea.
#
# Zweck ist ausschliesslich die Korrelationsanalyse. Mit den sechs Kern-
# datensaetzen aus config/datasets.yaml ist n = 6 zu klein, um Zusammenhaenge
# zwischen Datensatz-Eigenschaften und Matching-Guete abzusichern; hier ist
# n = 16. Die Kernauswertung und alle Detailtabellen der Ausarbeitung stammen
# weiterhin aus config/datasets.yaml.
#
# Automatisch erzeugt von scripts/make_extended_config.py — nicht von Hand
# editieren.
project: kg-quality-eval
output_dir: results/reports_extended
figures_dir: results/figures_extended
eval_split: test
seed_split: train
datasets:
- name: D_W_100K_V1
  loader: openea
  path: data/raw/openea/D_W_100K_V1
  fold: 1
  skip_matchers:
  - pyjedai_ngram
- name: D_W_100K_V2
  loader: openea
  path: data/raw/openea/D_W_100K_V2
  fold: 1
  skip_matchers:
  - pyjedai_ngram
- name: D_W_15K_V1
  loader: openea
  path: data/raw/openea/D_W_15K_V1
  fold: 1
  skip_matchers:
  - pyjedai_ngram
- name: D_W_15K_V2
  loader: openea
  path: data/raw/openea/D_W_15K_V2
  fold: 1
  skip_matchers:
  - pyjedai_ngram
- name: D_Y_100K_V1
  loader: openea
  path: data/raw/openea/D_Y_100K_V1
  fold: 1
  skip_matchers:
  - pyjedai_ngram
- name: D_Y_100K_V2
  loader: openea
  path: data/raw/openea/D_Y_100K_V2
  fold: 1
  skip_matchers:
  - pyjedai_ngram
- name: D_Y_15K_V1
  loader: openea
  path: data/raw/openea/D_Y_15K_V1
  fold: 1
  skip_matchers:
  - pyjedai_ngram
- name: D_Y_15K_V2
  loader: openea
  path: data/raw/openea/D_Y_15K_V2
  fold: 1
  skip_matchers:
  - pyjedai_ngram
- name: EN_DE_100K_V1
  loader: openea
  path: data/raw/openea/EN_DE_100K_V1
  fold: 1
  skip_matchers:
  - pyjedai_ngram
- name: EN_DE_100K_V2
  loader: openea
  path: data/raw/openea/EN_DE_100K_V2
  fold: 1
  skip_matchers:
  - pyjedai_ngram
- name: EN_DE_15K_V1
  loader: openea
  path: data/raw/openea/EN_DE_15K_V1
  fold: 1
  skip_matchers:
  - pyjedai_ngram
- name: EN_DE_15K_V2
