metrics:
- basic_stats
- degree_distribution
- property_distribution
- connectivity
- long_tail
- attribute_completeness
- type_distribution
- schema_heterogeneity
- aligned_consistency
- alignment_metrics
- alignment_reachability
matchers:
- name: value_overlap
- name: pyjedai_ngram
- name: structural_propagation
- name: paris
  params:
    jar_path: tools/paris_0_3.jar
    heap: 4g
    timeout_s: 7200
backend:
  mode: pandas
  spark_master: local[*]
  spark_memory: 4g
  spark_metrics:
  - basic_stats
  - degree_distribution
  - property_distribution
