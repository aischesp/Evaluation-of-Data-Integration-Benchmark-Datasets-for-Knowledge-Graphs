  fold: 1
  skip_matchers:
  - pyjedai_ngram
- name: EN_FR_100K_V2
  loader: openea
  path: data/raw/openea/EN_FR_100K_V2
  fold: 1
  skip_matchers:
  - pyjedai_ngram
- name: EN_FR_15K_V1
  loader: openea
  path: data/raw/openea/EN_FR_15K_V1
  fold: 1
  skip_matchers:
